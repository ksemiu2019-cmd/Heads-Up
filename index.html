<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heads Up! Pop Culture + Sports</title><style>body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center;min-height:100vh;align-items:center;padding:18px;box-sizing:border-box}.app{width:min(680px,100%);background:#1c1c1e;border-radius:28px;padding:28px;text-align:center;box-sizing:border-box}h1{font-size:42px;margin:0 0 8px}.sub,.small{color:#aaa}.stats{display:flex;justify-content:space-between;margin-bottom:24px}.word{font-size:clamp(42px,11vw,82px);font-weight:900;line-height:1.02;min-height:170px;display:flex;align-items:center;justify-content:center}.category{color:#aaa;margin-bottom:22px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:0;border-radius:18px;min-height:64px;font-size:20px;font-weight:800;cursor:pointer}.pass{background:#333;color:#fff}.correct,.start{background:#fff;color:#111}.start{width:100%}.hidden{display:none}.score{font-size:76px;font-weight:900}@media(max-width:430px){.app{padding:22px}h1{font-size:34px}}</style></head><body><main class="app"><section id="setup"><h1>Heads Up! 🎉</h1><p class="sub">Pop Culture + Sports</p><p>60 seconds. Give clues without saying the name on screen.</p><button class="start" id="start">Start Game</button></section><section id="game" class="hidden"><div class="stats"><span>Score: <b id="score">0</b></span><span>Time: <b id="time">60</b>s</span></div><div class="word" id="word"></div><div class="category" id="category"></div><div class="buttons"><button class="pass" id="pass">↩ Pass</button><button class="correct" id="correct">✓ Correct</button></div></section><section id="results" class="hidden"><p class="small">TIME!</p><div class="score" id="final">0</div><p class="small">correct guesses</p><button class="start" id="again">Play Again</button></section></main><script>const cards=[['Sinners','Movie'],['F1: The Movie','Movie'],['Superman','Movie'],['Wicked: For Good','Movie'],['A Minecraft Movie','Movie'],['Jurassic World: Rebirth','Movie'],['The Fantastic Four: First Steps','Movie'],['How to Train Your Dragon','Movie'],['Avatar: Fire and Ash','Movie'],['Mission: Impossible - The Final Reckoning','Movie'],['Thunderbolts*','Movie'],['Captain America: Brave New World','Movie'],['Final Destination: Bloodlines','Movie'],['Spider-Man: Brand New Day','Movie'],['The Odyssey','Movie'],['Michael','Movie'],['Toy Story 5','Movie'],['The Super Mario Galaxy Movie','Movie'],['The Devil Wears Prada 2','Movie'],['Tom Holland','Actor'],['Zendaya','Actor'],['Timothée Chalamet','Actor'],['Margot Robbie','Actor'],['Ryan Gosling','Actor'],['Pedro Pascal','Actor'],['Florence Pugh','Actor'],['Michael B. Jordan','Actor'],['Sydney Sweeney','Actor'],['Jenna Ortega','Actor'],['Paul Mescal','Actor'],['Anne Hathaway','Actor'],['Matt Damon','Actor'],['Chris Pratt','Actor'],['Jack Black','Actor'],['Meryl Streep','Actor'],['Emily Blunt','Actor'],['Dwayne Johnson','Actor'],['Ryan Reynolds','Actor'],['Taylor Swift','Music'],['Drake','Music'],['Beyoncé','Music'],['The Weeknd','Music'],['Rihanna','Music'],['Bad Bunny','Music'],['Sabrina Carpenter','Music'],['Kendrick Lamar','Music'],['Travis Scott','Music'],['Harry Styles','Music'],['Eminem','Music'],['Lady Gaga','Music'],['Justin Bieber','Music'],['Adele','Music'],['Bruno Mars','Music'],['Ariana Grande','Music'],['Doja Cat','Music'],['Tems','Music'],['LeBron James','Sports'],['Stephen Curry','Sports'],['Serena Williams','Sports'],['Lionel Messi','Sports'],['Cristiano Ronaldo','Sports'],['Kobe Bryant','Sports'],['Simone Biles','Sports'],['Usain Bolt','Sports'],['Michael Jordan','Sports'],['Patrick Mahomes','Sports'],['Shohei Ohtani','Sports'],['Coco Gauff','Sports'],['Tom Brady','Sports'],['Tiger Woods','Sports'],['Luka Dončić','Sports'],['Victor Wembanyama','Sports'],['Naomi Osaka','Sports'],['Novak Djokovic','Sports'],['Jayson Tatum','Sports'],['Giannis Antetokounmpo','Sports']];let deck=[],i=0,score=0,time=60,timer;const $=x=>document.getElementById(x);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function show(){if(i>=deck.length){deck=shuffle(cards);i=0}$('word').textContent=deck[i][0];$('category').textContent=deck[i][1]}function next(){i++;show()}function start(){ $('setup').classList.add('hidden');$('results').classList.add('hidden');$('game').classList.remove('hidden');deck=shuffle(cards);i=0;score=0;time=60;$('score').textContent=0;$('time').textContent=60;show();clearInterval(timer);timer=setInterval(()=>{time--;$('time').textContent=time;if(time<=0)end()},1000)}function end(){clearInterval(timer);$('game').classList.add('hidden');$('results').classList.remove('hidden');$('final').textContent=score}$('start').onclick=start;$('again').onclick=start;$('correct').onclick=()=>{score++;$('score').textContent=score;next()};$('pass').onclick=next;</script></body></html>
