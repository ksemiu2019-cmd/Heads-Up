<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heads Up! Pop Culture + Sports</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center;min-height:100vh;align-items:center;padding:18px;box-sizing:border-box}.app{width:min(680px,100%);background:#1c1c1e;border-radius:28px;padding:28px;text-align:center;box-sizing:border-box}h1{font-size:42px;margin:0 0 8px}.sub,.small{color:#aaa}.setup-card{margin:20px 0;text-align:left}.setup-card label{display:block;font-weight:800;margin:14px 0 7px}input,select{width:100%;box-sizing:border-box;padding:14px;border:1px solid #444;background:#29292b;color:#fff;border-radius:12px;font-size:17px}.names{display:grid;gap:10px}.stats{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}.turn{font-size:19px;font-weight:800;margin:8px 0 18px}.scoreboard{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;padding-bottom:4px}.teamscore{background:#29292b;border-radius:12px;padding:9px 12px;min-width:90px}.teamscore.active{outline:2px solid #fff}.teamscore b{display:block;font-size:22px}.progress{color:#aaa;margin-bottom:10px}.word{font-size:clamp(42px,11vw,82px);font-weight:900;line-height:1.02;min-height:170px;display:flex;align-items:center;justify-content:center}.category{color:#aaa;margin-bottom:22px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:0;border-radius:18px;min-height:64px;font-size:20px;font-weight:800;cursor:pointer}.pass{background:#333;color:#fff}.correct,.start{background:#fff;color:#111}.start{width:100%}.hidden{display:none}.score{font-size:76px;font-weight:900}.final-board{display:grid;gap:10px;margin:20px 0}.final-row{display:flex;justify-content:space-between;align-items:center;background:#29292b;padding:14px 16px;border-radius:14px;font-size:20px}.final-row b{font-size:28px}@media(max-width:430px){.app{padding:22px}h1{font-size:34px}}
</style>
</head>
<body>
<main class="app">
<section id="setup">
<h1>Heads Up! 🎉</h1><p class="sub">Pop Culture + Sports</p>
<div class="setup-card">
<label for="teamCount">Players / teams</label>
<select id="teamCount"><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select>
<label for="questionsPerTeam">Questions per player / team</label>
<select id="questionsPerTeam"><option value="5">5 questions</option><option value="10">10 questions</option></select>
<label>Names</label><div class="names" id="names"></div>
</div>
<button class="start" id="start">Start Game</button>
<p class="small">Each turn has 60 seconds. Correct or Pass moves to the next question. After the selected number of questions, the next player/team takes their turn.</p>
</section>
<section id="game" class="hidden">
<div class="stats"><span>Time: <b id="time">60</b>s</span><span>Question: <b id="questionNum">1</b>/<b id="questionTotal">5</b></span></div>
<div class="turn" id="turn"></div>
<div class="scoreboard" id="scoreboard"></div>
<div class="word" id="word"></div><div class="category" id="category"></div>
<div class="buttons"><button class="pass" id="pass">↩ Pass</button><button class="correct" id="correct">✓ Correct</button></div>
</section>
<section id="results" class="hidden">
<p class="small">GAME OVER!</p><h2>Final Scores</h2><div class="final-board" id="finalBoard"></div>
<button class="start" id="again">Play Again</button>
</section>
</main>
<script>
const cards=[['Sinners','Movie'],['F1: The Movie','Movie'],['Superman','Movie'],['Wicked: For Good','Movie'],['A Minecraft Movie','Movie'],['Jurassic World: Rebirth','Movie'],['The Fantastic Four: First Steps','Movie'],['How to Train Your Dragon','Movie'],['Avatar: Fire and Ash','Movie'],['Mission: Impossible - The Final Reckoning','Movie'],['Thunderbolts*','Movie'],['Captain America: Brave New World','Movie'],['Final Destination: Bloodlines','Movie'],['Spider-Man: Brand New Day','Movie'],['The Odyssey','Movie'],['Michael','Movie'],['Toy Story 5','Movie'],['The Super Mario Galaxy Movie','Movie'],['The Devil Wears Prada 2','Movie'],['Tom Holland','Actor'],['Zendaya','Actor'],['Timothée Chalamet','Actor'],['Margot Robbie','Actor'],['Ryan Gosling','Actor'],['Pedro Pascal','Actor'],['Florence Pugh','Actor'],['Michael B. Jordan','Actor'],['Sydney Sweeney','Actor'],['Jenna Ortega','Actor'],['Paul Mescal','Actor'],['Anne Hathaway','Actor'],['Matt Damon','Actor'],['Chris Pratt','Actor'],['Jack Black','Actor'],['Meryl Streep','Actor'],['Emily Blunt','Actor'],['Dwayne Johnson','Actor'],['Ryan Reynolds','Actor'],['Taylor Swift','Music'],['Drake','Music'],['Beyoncé','Music'],['The Weeknd','Music'],['Rihanna','Music'],['Bad Bunny','Music'],['Sabrina Carpenter','Music'],['Kendrick Lamar','Music'],['Travis Scott','Music'],['Harry Styles','Music'],['Eminem','Music'],['Lady Gaga','Music'],['Justin Bieber','Music'],['Adele','Music'],['Bruno Mars','Music'],['Ariana Grande','Music'],['Doja Cat','Music'],['Tems','Music'],['LeBron James','Sports'],['Stephen Curry','Sports'],['Serena Williams','Sports'],['Lionel Messi','Sports'],['Cristiano Ronaldo','Sports'],['Kobe Bryant','Sports'],['Simone Biles','Sports'],['Usain Bolt','Sports'],['Michael Jordan','Sports'],['Patrick Mahomes','Sports'],['Shohei Ohtani','Sports'],['Coco Gauff','Sports'],['Tom Brady','Sports'],['Tiger Woods','Sports'],['Luka Dončić','Sports'],['Victor Wembanyama','Sports'],['Naomi Osaka','Sports'],['Novak Djokovic','Sports'],['Jayson Tatum','Sports'],['Giannis Antetokounmpo','Sports']];
const $=x=>document.getElementById(x);let teams=[],current=0,question=0,deck=[],cardIndex=0,time=60,timer;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function renderNames(){let n=Number($('teamCount').value);$('names').innerHTML='';for(let i=0;i<n;i++){let input=document.createElement('input');input.type='text';input.placeholder=`Player / Team ${i+1}`;input.value=`${i<2?'Team ': 'Player '}${i+1}`;input.dataset.index=i;$('names').appendChild(input)}}
$('teamCount').addEventListener('change',renderNames);renderNames();
function renderScores(){ $('scoreboard').innerHTML=teams.map((t,i)=>`<div class="teamscore ${i===current?'active':''}"><span>${escapeHtml(t.name)}</span><b>${t.score}</b></div>`).join('') }
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function showCard(){if(cardIndex>=deck.length){deck=shuffle(cards);cardIndex=0}$('word').textContent=deck[cardIndex][0];$('category').textContent=deck[cardIndex][1];$('questionNum').textContent=question+1;$('questionTotal').textContent=teams[current].limit}
function resetTimer(){clearInterval(timer);time=60;$('time').textContent=time;timer=setInterval(()=>{time--;$('time').textContent=time;if(time<=0){clearInterval(timer);finishTurn()}},1000)}
function start(){let inputs=[...document.querySelectorAll('#names input')];teams=inputs.map((x,i)=>({name:x.value.trim()||`Player / Team ${i+1}`,score:0,limit:Number($('questionsPerTeam').value)}));current=0;question=0;deck=shuffle(cards);cardIndex=0;$('setup').classList.add('hidden');$('results').classList.add('hidden');$('game').classList.remove('hidden');$('turn').textContent=`${teams[current].name}'s turn`;renderScores();showCard();resetTimer()}
function finishTurn(){clearInterval(timer);if(current===teams.length-1){endGame();return}current++;question=0;$('turn').textContent=`${teams[current].name}'s turn`;renderScores();showCard();resetTimer()}
function answer(correct){if(correct)teams[current].score++;question++;cardIndex++;renderScores();if(question>=teams[current].limit){finishTurn()}else{showCard()}}
function endGame(){clearInterval(timer);$('game').classList.add('hidden');$('results').classList.remove('hidden');let sorted=[...teams].sort((a,b)=>b.score-a.score);$('finalBoard').innerHTML=sorted.map(t=>`<div class="final-row"><span>${escapeHtml(t.name)}</span><b>${t.score}</b></div>`).join('')}
$('start').onclick=start;$('again').onclick=()=>{$('results').classList.add('hidden');$('setup').classList.remove('hidden')};$('correct').onclick=()=>answer(true);$('pass').onclick=()=>answer(false);
</script>
</body></html>
